<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>{% if book %}Edit Book{% else %}Add New Book{% endif %}</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #161820;
            --surface-alt: #1e2030;
            --border: #2a2c35;
            --border-dim: #1a1c24;
            --text-primary: #c8c6be;
            --text-secondary: #8a887e;
            --text-muted: #6b6960;
            --text-dim: #5a5c66;
            --text-bright: #e8e6de;
            --teal: #1d9e75;
            --teal-bg: #0a1612;
            --teal-border: #0f6e56;
            --blue: #378add;
            --blue-border: #185fa5;
            --blue-bg: #0a1222;
            --amber: #ba7517;
            --red: #e24b4a;
            --gray: #3a3c46;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 12px;
            padding: 24px;
            max-width: 780px;
        }

        .nav-link {
            font-size: 11px;
            color: var(--text-muted);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: block;
            margin-bottom: 16px;
        }
        .nav-link:hover { color: var(--teal); }

        h1 {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-bright);
            letter-spacing: 0.05em;
            margin-bottom: 20px;
        }

        /* ── Cards ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .card-header {
            padding: 7px 14px;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            background: var(--surface-alt);
        }

        .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .dot-teal { background: var(--teal); }
        .dot-blue { background: var(--blue); }
        .dot-amber { background: var(--amber); }
        .dot-gray { background: var(--gray); }

        .card-body { padding: 14px; }

        /* ── Form ── */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .form-row:last-child, .form-row-3:last-child { margin-bottom: 0; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }

        label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }
        .required { color: var(--teal); margin-left: 2px; }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 7px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
            outline: none;
            width: 100%;
            transition: border-color 0.15s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--teal); }
        textarea { resize: vertical; min-height: 70px; line-height: 1.6; }

        /* ISBN fetch row */
        .isbn-row { display: flex; gap: 8px; align-items: stretch; }
        .isbn-row input { flex: 1; }

        .btn-fetch {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.04em;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .btn-fetch:hover { color: var(--text-primary); border-color: var(--blue-border); background: var(--blue-bg); }

        #api-status { font-size: 10px; margin-top: 5px; min-height: 1.2em; color: var(--text-dim); }
        .status-success { color: var(--teal); }
        .status-error { color: var(--red); }

        /* Checkbox */
        .checkbox-group { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
        .checkbox-group input[type="checkbox"] {
            width: 14px; height: 14px;
            accent-color: var(--teal);
            flex-shrink: 0;
        }
        .checkbox-label { font-size: 11px; color: var(--text-secondary); cursor: pointer; }

        /* Submit */
        .btn-submit {
            width: 100%;
            padding: 10px;
            background: var(--teal-bg);
            color: var(--teal);
            border: 1px solid var(--teal-border);
            border-radius: 4px;
            font-size: 12px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: background 0.15s;
            margin-top: 4px;
        }
        .btn-submit:hover { background: #0d1f18; }

        /* ── Mobile ── */
        @media (max-width: 640px) {
            body { padding: 14px; max-width: 100%; }
            h1 { font-size: 22px; }
            .form-row, .form-row-3 { grid-template-columns: 1fr; gap: 10px; }
            .isbn-row { gap: 6px; }
            .btn-fetch { padding: 7px 10px; }
            input[type="text"],
            input[type="number"],
            select,
            textarea { font-size: 16px; padding: 10px 12px; }
            .btn-submit { padding: 14px; font-size: 13px; }
            .card-body { padding: 12px; }
        }
    </style>
</head>
<body>

    {% if book %}
        <a href="/book/{{ book['id'] }}" class="nav-link">← Cancel &amp; Back to Details</a>
    {% else %}
        <a href="/" class="nav-link">← Cancel &amp; Back to Library</a>
    {% endif %}

    <h1>{% if book %}Edit Book{% else %}Add New Book{% endif %}</h1>

    <form method="POST">

        <!-- ISBN Lookup -->
        <div class="card">
            <div class="card-header">
                <div class="dot dot-blue"></div>
                ISBN Lookup
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>ISBN (10 or 13)</label>
                    <div class="isbn-row">
                        <input type="text" id="isbn" name="isbn" value="{{ book['isbn'] if book else '' }}" placeholder="e.g. 9780441013593">
                        <button type="button" class="btn-fetch" id="fetch-btn">Fetch Info</button>
                    </div>
                    <div id="api-status"></div>
                </div>
            </div>
        </div>

        <!-- Bibliographic Info -->
        <div class="card">
            <div class="card-header">
                <div class="dot dot-teal"></div>
                Bibliographic Info
            </div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Title <span class="required">*</span></label>
                        <input type="text" id="title" name="title" value="{{ book['title'] if book else '' }}" required>
                    </div>
                    <div class="form-group">
                        <label>Author <span class="required">*</span></label>
                        <input type="text" id="author" name="author" value="{{ book['author'] if book else '' }}" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Series Name</label>
                        <input type="text" id="series_title" name="series_title" value="{{ book['series_title'] if book and book['series_title'] else '' }}">
                    </div>
                    <div class="form-group">
                        <label>Series #</label>
                        <input type="number" step="0.1" id="series_number" name="series_number" value="{{ book['series_number'] if book and book['series_number'] else '' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" id="published_year" name="published_year" value="{{ book['published_year'] if book and book['published_year'] else '' }}">
                    </div>
                    <div class="form-group">
                        <label>Publisher</label>
                        <input type="text" id="publisher" name="publisher" value="{{ book['publisher'] if book and book['publisher'] else '' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Format</label>
                        <select id="binding" name="binding">
                            <option value="Paperback" {% if book and book['binding'] == 'Paperback' %}selected{% endif %}>Paperback</option>
                            <option value="Hardcover" {% if book and book['binding'] == 'Hardcover' %}selected{% endif %}>Hardcover</option>
                            <option value="Mass Market Paperback" {% if book and book['binding'] == 'Mass Market Paperback' %}selected{% endif %}>Mass Market Paperback</option>
                            <option value="Leatherbound" {% if book and book['binding'] == 'Leatherbound' %}selected{% endif %}>Leatherbound</option>
                            <option value="Clothbound" {% if book and book['binding'] == 'Clothbound' %}selected{% endif %}>Clothbound</option>
                            <option value="Spiral Bound" {% if book and book['binding'] == 'Spiral Bound' %}selected{% endif %}>Spiral Bound</option>
                            <option value="Board Book" {% if book and book['binding'] == 'Board Book' %}selected{% endif %}>Board Book</option>
                            <option value="eBook" {% if book and book['binding'] == 'eBook' %}selected{% endif %}>eBook</option>
                            <option value="Other" {% if book and book['binding'] == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Pages</label>
                        <input type="number" id="page_count" name="page_count" value="{{ book['page_count'] if book and book['page_count'] else '' }}">
                    </div>
                </div>
            </div>
        </div>

        <!-- Reading Status & Flags -->
        <div class="card">
            <div class="card-header">
                <div class="dot dot-amber"></div>
                Reading Status &amp; Flags
            </div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Reading Status</label>
                        <select id="read_status" name="read_status">
                            <option value="" {% if not book or not book['read_status'] %}selected{% endif %}>Owned / No Status</option>
                            <option value="To Read" {% if book and book['read_status'] == 'To Read' %}selected{% endif %}>To Read (TBR)</option>
                            <option value="Read" {% if book and book['read_status'] == 'Read' %}selected{% endif %}>Read</option>
                            <option value="DNF" {% if book and book['read_status'] == 'DNF' %}selected{% endif %}>DNF (Did Not Finish)</option>
                            <option value="Reference" {% if book and book['read_status'] == 'Reference' %}selected{% endif %}>Reference</option>
                        </select>
                        <div class="checkbox-group" style="margin-top:4px">
                            <input type="checkbox" id="sync_status" name="sync_status" checked>
                            <label for="sync_status" class="checkbox-label">Apply status to all copies</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>&nbsp;</label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="is_signed" name="is_signed" {% if book and book['is_signed'] == 1 %}checked{% endif %}>
                            <label for="is_signed" class="checkbox-label">Signed Copy / Special</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Physical Details -->
        <div class="card">
            <div class="card-header">
                <div class="dot dot-gray"></div>
                Physical Details
            </div>
            <div class="card-body">
                <div class="form-row-3">
                    <div class="form-group">
                        <label>Height (mm)</label>
                        <input type="number" step="0.1" name="height" placeholder="e.g. 198" value="{{ book['height'] if book and book['height'] else '' }}">
                    </div>
                    <div class="form-group">
                        <label>Width (mm)</label>
                        <input type="number" step="0.1" name="width" placeholder="e.g. 130" value="{{ book['width'] if book and book['width'] else '' }}">
                    </div>
                    <div class="form-group">
                        <label>Weight (g)</label>
                        <input type="number" step="0.1" name="weight" placeholder="e.g. 245" value="{{ book['weight'] if book and book['weight'] else '' }}">
                    </div>
                </div>
                <div class="form-row" style="margin-top:12px">
                    <div class="form-group">
                        <label>Cover Image URL</label>
                        <input type="text" id="cover_url" name="cover_url" value="{{ book['cover_url'] if book and book['cover_url'] else '' }}">
                    </div>
                    <div class="form-group">
                        <label>Local Cover Filename</label>
                        <input type="text" id="cover_filename" name="cover_filename" placeholder="e.g. 9780441172719.jpg" value="{{ book['cover_filename'] if book and book['cover_filename'] else '' }}">
                    </div>
                </div>
            </div>
        </div>

        <!-- Notes -->
        <div class="card">
            <div class="card-header">
                <div class="dot dot-amber"></div>
                Notes
            </div>
            <div class="card-body">
                <div class="form-group">
                    <textarea id="notes" name="notes" placeholder="Acquisition notes, condition, provenance…">{{ book['notes'] if book and book['notes'] else '' }}</textarea>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit">
            {% if book %}Save Changes{% else %}Save to Library{% endif %}
        </button>
    </form>

    <script>
        {% if not book %}
        document.getElementById('isbn').addEventListener('blur', function() {
            const isbn = this.value.trim();
            const filenameField = document.getElementById('cover_filename');
            if (isbn && !filenameField.value) {
                filenameField.value = isbn + '.jpg';
            }
        });
        {% endif %}

        document.getElementById('fetch-btn').addEventListener('click', function() {
            const isbn = document.getElementById('isbn').value;
            const statusDiv = document.getElementById('api-status');
            if (!isbn) {
                statusDiv.textContent = "Please enter an ISBN first.";
                statusDiv.className = "status-error";
                return;
            }
            statusDiv.textContent = "Searching Open Library…";
            statusDiv.className = "";
            fetch('/api/lookup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({isbn: isbn})
            })
            .then(response => response.json())
            .then(data => {
                if (data.found) {
                    statusDiv.textContent = "✓ Found! Data populated.";
                    statusDiv.className = "status-success";
                    document.getElementById('title').value = data.title || '';
                    document.getElementById('author').value = data.author || '';
                    document.getElementById('published_year').value = data.published_year || '';
                    document.getElementById('page_count').value = data.page_count || '';
                    document.getElementById('publisher').value = data.publisher || '';
                    document.getElementById('cover_url').value = data.cover_url || '';
                    {% if not book %}
                    const filenameField = document.getElementById('cover_filename');
                    if (isbn && !filenameField.value) {
                        filenameField.value = isbn.trim() + '.jpg';
                    }
                    {% endif %}
                    if (data.suggested_status) {
                        document.getElementById('read_status').value = data.suggested_status;
                        statusDiv.textContent += " (Status matched from existing copy!)";
                    }
                } else {
                    statusDiv.textContent = "Book not found. Please enter details manually.";
                    statusDiv.className = "status-error";
                }
            })
            .catch(() => {
                statusDiv.textContent = "Error connecting to API.";
                statusDiv.className = "status-error";
            });
        });
    </script>

</body>
</html>
